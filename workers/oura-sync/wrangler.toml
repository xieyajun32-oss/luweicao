name = "luweicao-oura-sync"
main = "index.js"
compatibility_date = "2026-11-10"
# Preserve the existing dashboard configuration when Git deploys this Worker.
keep_vars = true

[vars]
SITE_ORIGIN = "https://luweicao.pages.dev"

[triggers]
# 00:30 UTC is 08:30 Asia/Shanghai.
crons = ["30 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
