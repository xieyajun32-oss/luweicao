<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>芦苇草人生复利系统</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#263d34;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #d7ded4;background:white;border-radius:9px;padding:10px 18px;color:inherit}button:hover{background:#e8eee3}.primary{background:#294c3e;color:white}aside{position:fixed;width:240px;height:100vh;background:#edf0e7;padding:38px 24px;border-right:1px solid #dde2d7}h1{font-family:serif;font-size:36px;font-weight:500;letter-spacing:2px}h2{font-size:20px}small,.muted{color:#78877c}nav button{display:block;width:100%;text-align:left;margin:12px 0;border:0;background:transparent}nav a{display:block;text-decoration:none;color:inherit;border-radius:9px;padding:10px 18px;margin:12px 0}nav a:hover{background:#e8eee3}aside{overflow-y:auto}nav button.active{background:#dce5d7}main{max-width:1260px;margin-left:240px;padding:36px 54px}.top{display:flex;justify-content:space-between;align-items:center}.hero{padding:24px 0 34px}.hero p{color:#78877c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:#fffefa;border:1px solid #e1e4da;border-radius:16px;padding:26px;margin-bottom:20px}.card p{color:#78877c}.label{font-size:12px;letter-spacing:2px;color:#8b9879}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}textarea{width:100%;min-height:160px;padding:16px;border:1px solid #d9dfd4;border-radius:10px;background:#fdfdf9;color:inherit;resize:vertical}input,select{padding:10px;border:1px solid #d9dfd4;border-radius:8px;max-width:100%;background:white;color:inherit}.field{margin:20px 0}.field label{display:block;margin-bottom:8px}.pill{padding:4px 10px;background:#edf1e8;border-radius:20px;font-size:12px}.entry{padding:18px 0;border-bottom:1px solid #e5e8df;white-space:pre-wrap}.footer{margin-top:35px;font-size:12px;color:#87917f}img{max-width:240px;border-radius:10px}.wide{grid-column:1/-1}@media(max-width:760px){aside{position:static;width:auto;height:auto;padding:18px}nav{display:flex;overflow:auto}nav button,nav a{white-space:nowrap;width:auto;margin:0}aside small{display:none}main{margin:0;padding:22px}.grid{grid-template-columns:1fr}h1{font-size:28px}.top{gap:12px}.card{padding:20px}}
</style><aside><div style="font-size:26px">♧ 芦苇草</div><small>人生复利系统 · PERSONAL GROWTH</small><nav id="nav"></nav><div class="footer">积累而不内耗<br>进步而不求满分</div></aside><main><div class="top"><span class="label">把日子过成自己的长期作品</span><button onclick="go('设置与记忆')">⚙ 记忆与设置</button></div><div id="app"></div><div class="footer"><a href="/posts/">文章</a> · <a href="/research/">投研</a> · <a href="/projects/">港股简报</a> · <a href="/about/">关于</a><br>私人的成长空间 · 北京时间 · 当前版本数据保存在此浏览器，请定期导出备份</div></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem('reed-v1'))||{days:{},weeks:{},mem:[]}}catch{db={days:{},weeks:{},mem:[]}}const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());let date=today,page='首页';const names=['首页','今日记录','本周聚焦','五个领域','人生时间轴'];const domains=['健康与身体','投资与资产','事业与项目','家庭与孩子','认知与成长'];const keys=['运动|睡眠|身体|网球|健康|散步','投资|资产|港股|收入|赚钱|支出','工作|项目|团队|事业','孩子|家庭|陪伴|亲子','阅读|学习|思考|认知'];function persist(){localStorage.setItem('reed-v1',JSON.stringify(db));if(!localStorage.getItem('reed-v1'))throw Error('保存失败')}function week(){let d=new Date(date+'T12:00:00+08:00');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)}function go(p){page=p;history.replaceState(null,'','#'+encodeURIComponent(p));render()}window.addEventListener('hashchange',()=>{const p=decodeURIComponent(location.hash.slice(1));if(names.includes(p)){page=p;render()}});function render(){ $('#nav').innerHTML=names.map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${{'首页':'◷','今日记录':'✎','本周聚焦':'◎','五个领域':'❀','人生时间轴':'↗'}[n]}　${n}</button>`).join('')+"<a href=\"/posts/\">▤　文章</a><a href=\"/research/\">◈　投研</a><a href=\"/projects/\">▥　港股简报</a><a href=\"https://hkipo-admin.pages.dev/admin/\">⚙　港股后台</a>";let h=`<div class="hero"><div class="label">${today.replaceAll('-',' / ')}</div><h1>${page==='首页'?'慢慢生长，日日复利。':page}</h1><p>${page==='首页'?'记录真实的生活，让每一次微小的行动，有迹可循。':'保留真实，给积累一点时间。'}</p></div>`;if(page==='首页'){h+=`<div class="grid">${names.slice(1).map((n,i)=>`<div class="card"><span class="label">0${i+1} / ${['RECORD','FOCUS','EXPLORE','MEMORIES'][i]}</span><h2>${n}</h2><p>${['写下今天的经历、行动与感受。','只留三件最重要的事，把精力放回值得的地方。','身体、财富、事业、家庭与认知，共同生长。','那些普通的日子，正在成为人生的厚度。'][i]}</p><button onclick="go('${n}')">${['开始记录','查看本周','进入领域','回看时光'][i]} ↗</button></div>`).join('')}</div><div class="card"><span class="label">YOUR JOURNEY</span><h2>已经留下 ${Object.keys(db.days).length} 天生活记录</h2><p>这里没有分数，也没有断签。每一次回来，都从当下开始。</p></div>`}else if(page==='今日记录'){let d=db.days[date]||{};h+=`<div class="card"><div class="row"><input type="date" value="${date}" onchange="date=this.value;render()"><span class="pill">一次输入 · 关联全局</span></div><h2>把今天的故事告诉我</h2><p>粘贴整篇日记，或使用手机键盘的麦克风口述。不用按栏目填写。</p><textarea id="rawDiary" onpaste="pasteDiaryPhotos(event)" style="min-height:300px" placeholder="今天发生了什么？做了什么？有什么感受？按自己的方式说就好。">${esc(db.drafts?.[date]||d.raw||'')}</textarea><div class="field"><label for="draftPhotoInput">照片（可直接粘贴，也可从相册选择）</label><input id="draftPhotoInput" type="file" accept="image/*" multiple onchange="addDiaryPhotos(this.files);this.value=\'\'"><p class="muted">最多 6 张，自动压缩后随草稿保存到当前浏览器。</p><div id="draftPhotos" class="row"></div></div><div class="row"><button class="primary" onclick="saveRawDraft()">保存原文草稿</button><button onclick="document.querySelector('#status').textContent='AI 整理尚未接通。原文可先保存为草稿；接通后将按四部分模板整理，供你确认。'">按模板整理日记</button></div><p id="status" role="status">AI 整理待接通 · 草稿不会被当作正式日记或完成记录</p><details><summary>整理规则与固定模板</summary><p>一、本周三件事（关联当周已确认计划，最多三件）<br>二、今日要事规划<br>三、赚钱、健康、家庭、思考（事实、判断、下一步）<br>四、今天的整体感受</p><p>保留原意、人物、金额和感受；缺失内容留空。整理后先预览确认，再保存正式日记。同一份记录供时间轴和领域引用。</p></details>${d.parts?`<h2>已有正式日记</h2><p>保存于 ${esc(d.saved)}</p><div style="white-space:pre-wrap">${esc(d.parts.join('\n\n'))}</div><button onclick="exportDay(date)">导出 Markdown</button>`:''}</div>`}else if(page==='本周聚焦'){let w=db.weeks[week()]||{};h+=`<div class="card"><span class="label">WEEK OF ${week()}</span><h2>本周最重要的三件事</h2>${[0,1,2].map(i=>`<div class="field row"><span>0${i+1}</span><input id="w${i}" style="flex:1" placeholder="把精力留给真正重要的事" value="${esc(w.items?.[i]||'')}"><select id="s${i}">${['待推进','推进中','已沉淀','主动取消'].map(s=>`<option ${w.states?.[i]===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}<textarea id="review" placeholder="调整原因、周中检查与周末回顾">${esc(w.review||'')}</textarea><button class="primary" onclick="saveWeek()">保存本周聚焦</button><p id="status" role="status"></p></div><div class="grid">${['周一 · 确定三件事','周三 · 检查有没有跑偏','周五 · 钱和项目复盘','周日 · 沉淀、健康、资产、家庭'].map(x=>`<div class="card">${x}<p>08:00 · 北京时间</p></div>`).join('')}</div><p class="muted">月末校准：目标还对吗？动作太多了吗？需要删掉什么？此处展示复盘节奏，未新建提醒。</p>`}else if(page==='五个领域'){h+=`<div class="grid">${domains.map((n,i)=>{let entries=Object.entries(db.days).filter(([d,v])=>new RegExp(keys[i]).test(v.parts.join('\n')));return `<div class="card"><span class="label">${['BODY','WEALTH','WORK','FAMILY','MIND'][i]}</span><h2>${n}</h2><p>${entries.length} 条相关日记 · 关键词索引</p>${entries.map(([d])=>`<button onclick="date='${d}';go('今日记录')">${d} ↗</button>`).join('')||'<small>从真实记录开始积累</small>'}</div>`}).join('')}</div><p class="muted">领域引用同一份日记；关键词匹配不代表 AI 判断。</p>`}else if(page==='人生时间轴'){h+=`<div class="row"><input type="search" id="search" placeholder="搜索记忆中的关键词" oninput="timeline(this.value)"><input type="month" onchange="timeline(this.value)"></div><div id="timeline"></div>`}else{h+=`<div class="card"><h2>长期记忆中心</h2><p>记录你确认的事实、偏好与原则。旧知识库尚未扫描，AI 检索尚未接通。</p><textarea id="memory" placeholder="一条值得长期记住的信息"></textarea><input id="source" placeholder="来源或日期"><button onclick="addMemory()">添加待确认记忆</button>${db.mem.map((m,i)=>`<div class="entry">${esc(m.text)}<br><small>${esc(m.source)} · ${m.confirmed?'用户已确认':'待确认'}</small><div class="row"><button onclick="editMemory(${i})">修改</button><button onclick="db.mem[${i}].confirmed=true;persist();render()">确认</button><button onclick="if(confirm('删除这条记忆？')){db.mem.splice(${i},1);persist();render()}">删除</button></div></div>`).join('')}</div><div class="card"><h2>数据与备份</h2><p>当前为浏览器本地版本，不支持跨设备同步。导出文件包含日记、照片、周计划与记忆。</p><button onclick="download('芦苇草人生复利系统备份.json',JSON.stringify(db,null,2),'application/json')">导出完整备份</button> <label>恢复备份 <input type="file" accept=".json" onchange="restore(this)"></label><p>AI 服务、云端数据库及独立的家人资料访问控制尚未接通。</p></div>`}$('#app').innerHTML=h;if(page==='人生时间轴')timeline('');if(page==='今日记录')renderDraftPhotos()}
function saveDay(){try{let parts=[0,1,2,3].map(i=>$('#f'+i).value);if(parts[0].split('\n').filter(x=>x.trim()).length>3)throw Error('本周三件事最多三行');if(date!==today&&db.days[date]&&!confirm('明确确认修改 '+date+' 的已有日记？'))return;let photo=db.days[date]?.photo||null;const finish=()=>{db.days[date]={parts,photo,saved:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})};persist();let check=JSON.parse(localStorage.getItem('reed-v1'));if(JSON.stringify(check.days[date].parts)!==JSON.stringify(parts))throw Error('回读核实失败');render();$('#status').textContent='已保存至此浏览器，并回读核实。尚未写入 Obsidian。'};let f=$('#photo').files[0];if(f){if(f.size>1500000)throw Error('请选择小于 1.5MB 的照片');let r=new FileReader();r.onload=()=>{try{photo=r.result;finish()}catch(e){$('#status').textContent=e.message}};r.onerror=()=>$('#status').textContent='照片读取失败';r.readAsDataURL(f)}else finish()}catch(e){$('#status').textContent='未保存：'+e.message}}
function saveWeek(){try{db.weeks[week()]={items:[0,1,2].map(i=>$('#w'+i).value),states:[0,1,2].map(i=>$('#s'+i).value),review:$('#review').value};persist();$('#status').textContent='本周聚焦已保存'}catch(e){$('#status').textContent='保存失败：'+e.message}}function timeline(q){$('#timeline').innerHTML=Object.entries(db.days).sort((a,b)=>b[0].localeCompare(a[0])).filter(([d,v])=>(d+v.parts.join('')).includes(q)).map(([d,v])=>`<div class="card"><span class="label">${d}</span><h2>${d.replaceAll('-','')} 晨夕日记</h2>${v.photo?`<img src="${v.photo}">`:''}<p style="white-space:pre-wrap">${esc(v.parts[3]||v.parts[2]||'这一天的记录已留存')}</p><button onclick="date='${d}';go('今日记录')">阅读完整日记 ↗</button><button onclick="exportDay('${d}')">导出 Markdown</button></div>`).join('')||'<div class="card"><h2>时间会记得</h2><p>还没有符合条件的记录。写下今天，开始积累。</p></div>'}function download(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportDay(d){download(d.replaceAll('-','')+' 晨夕日记.md','# '+d.replaceAll('-','')+' 晨夕日记\n\n'+['一、本周三件事','二、今日要事规划','三、4 个最低动作完成情况：赚钱、健康、家庭、思考','四、今天的整体感受'].map((h,i)=>'## '+h+'\n\n'+db.days[d].parts[i]).join('\n\n'),'text/markdown')}function addMemory(){if(!$('#memory').value.trim())return;db.mem.push({text:$('#memory').value,source:$('#source').value||today,confirmed:false});persist();render()}function editMemory(i){let t=prompt('修改记忆',db.mem[i].text);if(t!==null){db.mem[i].text=t;db.mem[i].confirmed=false;persist();render()}}const pendingPhotos={};let photosLoading=0;
function diaryPhotos(d=date){return pendingPhotos[d]??(pendingPhotos[d]=[...(db.draftPhotos?.[d]||[])])}
function renderDraftPhotos(){const box=$('#draftPhotos');if(!box)return;box.replaceChildren();diaryPhotos().forEach((src,i)=>{const item=document.createElement('div'),im=document.createElement('img'),btn=document.createElement('button');im.src=src;im.alt='日记照片 '+(i+1);im.style.maxWidth='140px';btn.textContent='移除';btn.onclick=()=>{diaryPhotos().splice(i,1);renderDraftPhotos();$('#status').textContent='照片已移除，请保存草稿以保留修改。'};item.append(im,document.createElement('br'),btn);box.append(item)})}
function pasteDiaryPhotos(e){const files=Array.from(e.clipboardData?.items||[]).filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(!files.length)return;if(!e.clipboardData.getData('text/plain'))e.preventDefault();addDiaryPhotos(files)}
function compressDiaryPhoto(file){return new Promise((resolve,reject)=>{if(file.size>25*1024*1024)return reject(Error('单张照片不能超过 25MB'));const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.75);if(data.length>850000)throw Error('照片压缩后仍较大，请选用较小照片');resolve(data)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('无法读取此照片，请改用 JPEG 或 PNG 格式'))};im.src=url})}
async function addDiaryPhotos(files){const target=date;photosLoading++;let added=0;try{for(const f of Array.from(files)){if(!f.type.startsWith('image/'))continue;if(diaryPhotos(target).length>=6)throw Error('每篇草稿最多 6 张照片');const data=await compressDiaryPhoto(f);if(diaryPhotos(target).length>=6)throw Error('每篇草稿最多 6 张照片');diaryPhotos(target).push(data);added++}if(date===target&&$('#status'))$('#status').textContent='已添加 '+added+' 张照片，请保存草稿。'}catch(e){if(date===target&&$('#status'))$('#status').textContent='照片添加提示：'+e.message+'。已添加的照片保留，可保存草稿。'}finally{photosLoading--;if(date===target)renderDraftPhotos()}}
function saveRawDraft(){const before=JSON.stringify(db);try{if(photosLoading)throw Error('照片正在处理，请稍后保存');db.drafts??={};db.draftPhotos??={};db.drafts[date]=$('#rawDiary').value;db.draftPhotos[date]=[...diaryPhotos()];persist();const check=JSON.parse(localStorage.getItem('reed-v1'));if(check.drafts[date]!==db.drafts[date]||JSON.stringify(check.draftPhotos[date])!==JSON.stringify(db.draftPhotos[date]))throw Error('回读不一致');$('#status').textContent='原文和 '+db.draftPhotos[date].length+' 张照片已保存到此浏览器并回读核实。尚未整理为正式日记。'}catch(e){db=JSON.parse(before);$('#status').textContent='草稿保存失败：'+e.message+'。若空间不足，请先导出备份并减少照片；当前输入仍保留。'}}
async function restore(el){try{let v=JSON.parse(await el.files[0].text());if(!v.days||!v.weeks||!Array.isArray(v.mem)||Object.values(v.days).some(d=>!Array.isArray(d.parts)||d.parts.length!==4))throw Error('备份格式不正确');if(!confirm('恢复将替换当前浏览器内的全部产品数据，是否继续？'))return;db=v;persist();render()}catch(e){alert('恢复失败：'+e.message)}}if(names.includes(decodeURIComponent(location.hash.slice(1))))page=decodeURIComponent(location.hash.slice(1));render();
</script></html>
